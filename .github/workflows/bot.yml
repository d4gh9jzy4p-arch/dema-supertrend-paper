name: paper-bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check candles and trade on paper
        run: python bot.py --once
      - name: Second account (v2 test). Never blocks the original.
        continue-on-error: true
        run: python shadow.py --once
      - name: Third account (2 hour test). Never blocks the original.
        continue-on-error: true
        run: python shadow2h.py --once
      - name: Rebuild the results page
        run: python report.py
      - name: Rebuild the v2 results page
        continue-on-error: true
        run: python shadow_report.py
      - name: Rebuild the 2 hour results page
        continue-on-error: true
        run: python shadow2h_report.py
      - name: Save the results
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "paper bot update"
          git push
